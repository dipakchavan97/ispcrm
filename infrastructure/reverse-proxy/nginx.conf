# ==============================================================================
# ISPCRM PRODUCTION REVERSE PROXY CONFIGURATION (NGINX)
# Target Domain: cloudsetup.in (app.cloudsetup.in & vpn.cloudsetup.in)
# ==============================================================================
# Public Port Surface: TCP 443 ONLY (plus optional TCP 80 for ACME challenge)
#
# 1. Layer 4 TCP Stream SNI Demultiplexing on Port 443:
#    - vpn.cloudsetup.in -> ispcrm-sstp:443 (accel-pppd SSTP VPN Concentrator)
#    - app.cloudsetup.in -> 127.0.0.1:8443 (Internal HTTPS Web & API Gateway)
#
# 2. Layer 7 HTTP Port 80:
#    - Let's Encrypt ACME HTTP-01 Challenge handling (/.well-known/acme-challenge/)
#    - 301 Permanent Redirect to https://app.cloudsetup.in
#
# 3. Layer 7 HTTPS Port 8443 (Internal, fed by Stream map):
#    - Terminates TLS for app.cloudsetup.in
#    - Proxies /api/* to ispcrm-api:4000/api/* (Same-Origin)
#    - Proxies /* to ispcrm-web:3000/*
#    - Injects window.process.env.NEXT_PUBLIC_API_URL="/api" into HTML head
#      to guarantee the browser client calls same-origin /api over port 443
#      without requiring application rebuilding!
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

# ------------------------------------------------------------------------------
# 1. LAYER 4 STREAM MODULE (SNI ROUTING ON TCP 443)
# ------------------------------------------------------------------------------
stream {
    # Extract SNI hostname from TLS ClientHello record without decrypting payload
    map $ssl_preread_server_name $backend_pool {
        # Web browsers connecting to app.cloudsetup.in send SNI "app.cloudsetup.in"
        app.cloudsetup.in      web_tls_backend;

        # Explicit SNI for SSTP
        vpn.cloudsetup.in      sstp_backend;

        # RouterOS v6 SSTP client connects without TLS SNI extension; route default to SSTP
        default                sstp_backend;
    }

    upstream sstp_backend {
        server ispcrm-sstp:443;
    }

    upstream web_tls_backend {
        server 127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend_pool;
        
        # Keep persistent SSTP VPN tunnels alive without abrupt timeouts
        proxy_timeout 1d;
        proxy_connect_timeout 5s;
    }
}

# ------------------------------------------------------------------------------
# 2. LAYER 7 HTTP / HTTPS MODULE
# ------------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # Upstream definitions for internal Docker backend services
    upstream web_service {
        server ispcrm-web:3000 max_fails=3 fail_timeout=10s;
    }

    upstream api_service {
        server ispcrm-api:4000 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------------------------------
    # HTTP Port 80: ACME HTTP-01 Challenge & Automatic HTTPS Redirect
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name app.cloudsetup.in vpn.cloudsetup.in;

        # ACME challenge verification path for Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other plain HTTP requests to HTTPS
        location / {
            return 301 https://app.cloudsetup.in$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Port 8443: Web Application & REST API (Internal, fed by Stream map)
    # --------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name app.cloudsetup.in;

        # Public TLS Certificate & Private Key (Let's Encrypt / Custom)
        ssl_certificate /etc/ssl/certs/app/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/app/privkey.pem;

        # Hardened TLS Protocols & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ----------------------------------------------------------------------
        # REST API Routes: Same-Origin https://app.cloudsetup.in/api/*
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
            proxy_connect_timeout 5s;
        }

        # ----------------------------------------------------------------------
        # Next.js Web Frontend Routes
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://web_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
