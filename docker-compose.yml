services:
  # --------------------------------------------------------
  # 1. PostgreSQL 16 (Primary & FreeRADIUS Database)
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ispcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ispcrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/freeradius/sql/postgresql/schema.sql:/docker-entrypoint-initdb.d/10-freeradius.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ispcrm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ispcrm-net

  # --------------------------------------------------------
  # 2. Redis 7 (BullMQ & Cache)
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ispcrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ispcrm-net

  # --------------------------------------------------------
  # 3. FreeRADIUS 3.x (AAA Engine)
  # --------------------------------------------------------
  freeradius:
    build:
      context: ./infrastructure/freeradius
      dockerfile: Dockerfile
    container_name: ispcrm-freeradius
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    networks:
      - ispcrm-net

  # --------------------------------------------------------
  # 4. Backend REST API (NestJS Modular Monolith)
  # --------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ispcrm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ispcrm?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-in-production
      USE_MOCK_MIKROTIK: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ispcrm-net

  # --------------------------------------------------------
  # 5. Background Async Worker (BullMQ)
  # --------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ispcrm-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ispcrm?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_PORT: 4001
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ispcrm-net

  # --------------------------------------------------------
  # 6. Web Admin Portal (Next.js 14)
  # --------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ispcrm-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ispcrm-net

networks:
  ispcrm-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
