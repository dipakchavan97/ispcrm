# ==============================================================================
# ISPCRM PRODUCTION DOCKER COMPOSE — LINUX VPS ONLY
# ==============================================================================
# NOTE: The Next.js frontend (apps/web) is DEPLOYED TO VERCEL and is NOT included here.
# This compose file manages only persistent VPS services: Database, Redis,
# FreeRADIUS, NestJS API, BullMQ Worker, and the accel-pppd SSTP Concentrator.
# ==============================================================================

services:
  # --------------------------------------------------------
  # 1. PostgreSQL 16 (Relational DB & FreeRADIUS backend)
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ispcrm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ispcrm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ispcrm}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/freeradius/sql/postgresql/schema.sql:/docker-entrypoint-initdb.d/10-freeradius.sql:ro
    # SECURITY: Port 5432 is NEVER exposed publicly to the host or internet.
    # It is strictly internal to the ispcrm-prod-net Docker bridge.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ispcrm_admin} -d ${POSTGRES_DB:-ispcrm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ispcrm-prod-net

  # --------------------------------------------------------
  # 2. Redis 7 (BullMQ Queues & Cache)
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ispcrm-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis_prod_data:/data
    # SECURITY: Port 6379 is NEVER exposed publicly.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ispcrm-prod-net

  # --------------------------------------------------------
  # 3. FreeRADIUS 3.x (AAA Server)
  # --------------------------------------------------------
  freeradius:
    build:
      context: ./infrastructure/freeradius
      dockerfile: Dockerfile
    container_name: ispcrm-freeradius
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    networks:
      - ispcrm-prod-net

  # --------------------------------------------------------
  # 4. Backend REST API (NestJS Modular Monolith)
  # --------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ispcrm-api
    restart: always
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ROUTER_ENCRYPTION_KEY: ${ROUTER_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SSTP_SERVER_HOST: ${SSTP_SERVER_HOST}
      SSTP_SERVER_PORT: ${SSTP_SERVER_PORT:-443}
      SSTP_SERVICE_HOST: sstp
      SSTP_CHAP_SECRETS_PATH: /etc/ppp/chap-secrets
      SSTP_CA_CERT_PATH: /etc/ssl/sstp/fullchain.pem
    # Reverse proxy binds to 127.0.0.1:4000 (Nginx/Caddy terminates SSL for api.<domain>)
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - sstp_prod_secrets:/etc/ppp
      - ${LETSENCRYPT_CERT_DIR:-/etc/letsencrypt/live/vpn.yourdomain.com}:/etc/ssl/sstp:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ispcrm-prod-net

  # --------------------------------------------------------
  # 5. Background Async Worker (BullMQ)
  # --------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ispcrm-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKER_PORT: 4001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ispcrm-prod-net

  # --------------------------------------------------------
  # 6. SSTP VPN Concentrator (accel-pppd with Public TLS)
  # --------------------------------------------------------
  sstp:
    build:
      context: ./infrastructure/sstp
      dockerfile: Dockerfile
    container_name: ispcrm-sstp
    entrypoint: ["/entrypoint.prod.sh"]
    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
    ports:
      # Publicly exposed SSTP listener on TCP 443
      - "443:443"
      # Management CLI bound strictly to localhost loopback
      - "127.0.0.1:2001:2001"
    volumes:
      - sstp_prod_secrets:/etc/ppp
      - ${LETSENCRYPT_CERT_DIR:-/etc/letsencrypt/live/vpn.yourdomain.com}:/etc/ssl/sstp:ro
      - /lib/modules:/lib/modules:ro
    networks:
      - ispcrm-prod-net

networks:
  ispcrm-prod-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  sstp_prod_secrets:
